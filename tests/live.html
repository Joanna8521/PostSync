<script>
// 假的 chrome API。content.js 一載入就會呼叫 storage 與 runtime，
// 沒有這層它會在第一行就丟例外，然後整支安靜地不啟動。
window.__sent = [];
// file:// 的 location.hostname 是空字串，content.js 會認不出平台而整個不啟動。
// 這一行只在測試頁存在。
window.POST_SYNC_HOST = 'www.facebook.com';
window.chrome = {
  storage: {
    sync: {
      get(_keys, cb) { cb({}); },        // 什麼都沒設 → enabled 應該預設為 true
      set(_o, cb) { cb && cb(); },
    },
    local: { get(_k, cb) { cb({}); }, set(_o, cb) { cb && cb(); } },
    onChanged: { addListener() {} },
  },
  runtime: {
    lastError: null,
    sendMessage(msg, cb) {
      window.__sent.push(msg);
      cb && cb({ ok: true, drive: { docName: '20260813_測試_Facebook', docUrl: '#' }, f4: { chunks: 3 } });
    },
    onMessage: { addListener() {} },
  },
};
</script>
<script src="../extension/src/adapters.js?v=10"></script>
<script src="../extension/src/naming.js?v=10"></script>
<script src="../extension/src/extract.js?v=10"></script>
<script src="../extension/src/content.js?v=10"></script>
<script>
// 量到底發生了什麼，不要靠眼睛猜
function report() {
  const btn = document.querySelector('.postsync-btn');
  const act = document.querySelector('.postsync-active');
  const cs = btn ? getComputedStyle(btn) : null;
  const r = btn ? btn.getBoundingClientRect() : null;
  const lines = [
    `content script 注入：${document.documentElement.dataset.postSync || '❌ 沒有'}`,
    `adapter：${self.POST_SYNC ? (self.POST_SYNC.adapterFor('www.facebook.com') || {}).id || '❌ 認不出' : '❌ 沒載到'}`,
    `抽取層：${self.POST_SYNC_EXTRACT ? 'OK' : '❌ 沒載到'}`,
    `偵測到貼文：${self.POST_SYNC_EXTRACT
      ? self.POST_SYNC_EXTRACT.outermost(self.POST_SYNC.adapterFor('www.facebook.com'), document).length + ' 則'
      : '?'}`,
    `按鈕存在：${btn ? 'OK' : '❌ 沒有 .postsync-btn'}`,
    btn ? `  display=${cs.display} visibility=${cs.visibility} opacity=${cs.opacity}` : '',
    btn ? `  z-index=${cs.zIndex} position=${cs.position}` : '',
    r ? `  位置 x=${Math.round(r.left)} y=${Math.round(r.top)} w=${Math.round(r.width)} h=${Math.round(r.height)}` : '',
    r ? `  在視窗內：${r.left >= 0 && r.top >= 0 && r.right <= innerWidth && r.bottom <= innerHeight ? 'OK' : '❌ 跑出畫面'}` : '',
    `鎖定的貼文：${act ? act.getAttribute('aria-posinset') || '有' : '❌ 沒有'}`,
    `視窗：${innerWidth}x${innerHeight}`,
  ].filter(Boolean);
  document.getElementById('panel').textContent = lines.join('\n');
}
setTimeout(report, 900);
window.addEventListener('scroll', () => setTimeout(report, 120), { passive: true });
window.__report = report;
</script>
