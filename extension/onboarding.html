<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title data-i18n="obTitle"></title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    color: #1f2937; background: #f8fafc; line-height: 1.75;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 40px 24px 72px; }
  header { background: #0d6a5a; color: #fff; padding: 34px 0; }
  header .wrap { padding: 0 24px; }
  header h1 { font-size: 26px; }
  header p { color: #a7f3d0; margin-top: 6px; }
  h2 { font-size: 17px; margin: 30px 0 10px; }
  ol, ul { margin: 10px 0 0 20px; }
  li { margin-bottom: 8px; }
  .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 18px 22px; margin-top: 14px; }
  .warn { background: #fffbeb; border-color: #fde68a; }
  code { background: #f1f5f9; padding: 2px 6px; border-radius: 5px; font-size: 13px; }
  a, a:link, a:visited, a:hover, a:active { color: #0d6a5a; }
  button {
    background: #0d6a5a; border: 1px solid #0d6a5a; color: #fff;
    border-radius: 8px; padding: 10px 18px; font-size: 14px;
    font-weight: 700; cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  .msg { margin-top: 10px; font-size: 13px; min-height: 18px; }
  .ok { color: #10704a; } .err { color: #dc2626; }
  table { border-collapse: collapse; width: 100%; margin-top: 10px; font-size: 14px; }
  th, td { border: 1px solid #e5e7eb; padding: 7px 10px; text-align: left; }
  th { background: #f1f5f9; }
</style>
</head>
<body>
<header><div class="wrap"><h1>⚡ Post Sync</h1><p data-i18n="brandTagline"></p></div></header>
<div class="wrap">

  <h2 data-i18n="obStep1"></h2>
  <div class="card">
    <p data-i18n="obStep1Body"></p>
    <p style="margin-top:10px"><button id="connect" data-i18n="btnConnectGoogle"></button></p>
    <div class="msg" id="msg"></div>
  </div>

  <h2 data-i18n="obStep2"></h2>
  <div class="card">
    <p data-i18n="obStep2Body"></p>
    <table>
      <tr><th data-i18n="obColPlatform"></th><th data-i18n="obColUrl"></th></tr>
      <tr><td>Facebook</td><td>facebook.com</td></tr>
      <tr><td>Threads</td><td>threads.com</td></tr>
      <tr><td>X</td><td>x.com</td></tr>
      <tr><td>Instagram</td><td>instagram.com</td></tr>
      <tr><td>LinkedIn</td><td>linkedin.com</td></tr>
    </table>
    <p style="margin-top:12px" data-i18n="obStep2Alt"></p>
    <p style="margin-top:8px" data-i18n="obStep2Hotkey"></p>
  </div>

  <h2 data-i18n="obStep3"></h2>
  <div class="card">
    <p data-i18n="obStep3Body"></p>
    <p style="margin-top:8px" data-i18n="obStep3Why"></p>
  </div>

  <h2 data-i18n="obKnowTitle"></h2>
  <div class="card warn">
    <ul>
      <li data-i18n="obKnowManual"></li>
      <li data-i18n="obKnowDup"></li>
      <li data-i18n="obKnowDrift"></li>
      <li data-i18n="obKnowNoop"></li>
    </ul>
  </div>

</div>
<script src="src/i18n.js"></script>
<script src="src/onboarding.js"></script>
</body>
</html>
